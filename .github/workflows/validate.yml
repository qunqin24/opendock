name: Validate crawler and site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          # Check the actual PR head, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      # Same-repository PRs exercise the complete live pipeline without writing
      # a snapshot commit or deploying. Forks still run tests/check/build.
      - name: Full refresh smoke test (no commit)
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 25
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm data --fresh
      - name: Build generated site
        run: pnpm build
