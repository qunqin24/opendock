name: Refresh plugin data

# The whole point of the site is that nobody maintains the list by hand:
# this job re-crawls npm + GitHub daily and commits the new snapshot, which
# is then deployed directly to the production static server.
on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC ≈ 11:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      # Version comes from the "packageManager" field in package.json —
      # keep the two in sync, the action hard-fails when it is missing.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Not required for correctness — entries expire after 20h — but it makes
      # a re-run after a failed job cheap instead of a full re-crawl.
      - name: Restore crawler cache
        id: crawler-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: crawler-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: crawler-

      # Yesterday's snapshot, so IndexNow can tell which pages changed.
      - name: Keep the previous snapshot
        run: cp src/data/plugins.json "$RUNNER_TEMP/previous-plugins.json"

      - name: Crawl npm + GitHub
        timeout-minutes: 30
        env:
          # Default token is enough: 5000 GraphQL points/hour vs ~50 needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm data

      # GitHub profiles for the author pages. Best effort: never fails the job.
      - name: Fetch author profiles
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm data:authors

      # Save even if crawling/building fails, before a later step can lose progress.
      - name: Save crawler cache
        if: always() && steps.crawler-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: crawler-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify the site still builds with the new data
        run: |
          pnpm check
          pnpm test
          python3 scripts/test/deploy-receive.test.py
          pnpm build

      - name: Commit snapshot
        id: commit
        run: |
          git config user.name  'opendock-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add src/data src/data/authors.json data/history.json data/translations.json
          if git diff --staged --quiet; then
            echo 'No data changes.'
            exit 0
          fi
          git commit -m "chore(data): refresh plugin snapshot $(date -u +%F)"
          bash scripts/push-snapshot.sh "${GITHUB_REF_NAME}"
          echo 'pushed=true' >> "$GITHUB_OUTPUT"

      - name: Deploy verified static files to production
        env:
          DEPLOY_KEY: ${{ secrets.OPENDOCK_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.OPENDOCK_DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.OPENDOCK_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/opendock-ssh"
          trap 'rm -f "$RUNNER_TEMP/opendock-ssh/key"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/opendock-ssh/key"
          chmod 600 "$RUNNER_TEMP/opendock-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/opendock-ssh/known_hosts"
          tar -C dist -czf - . | ssh -T \
            -i "$RUNNER_TEMP/opendock-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/opendock-ssh/known_hosts" \
            -o ConnectTimeout=30 -o ServerAliveInterval=30 \
            "opendock-deploy@$DEPLOY_HOST"

      # Tells Bing & co. which pages changed, once the push has deployed.
      # Best effort: a failed ping never fails the refresh.
      - name: Ping search engines (IndexNow)
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/indexnow.mjs --previous "$RUNNER_TEMP/previous-plugins.json"
